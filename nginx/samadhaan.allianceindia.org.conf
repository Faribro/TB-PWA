# ═══════════════════════════════════════════════════════════════════════
# SAMADHAAN (TB-PWA) — Host Nginx Virtual Host Configuration
# Domain: samadhaan.allianceindia.org
# Upstream: http://127.0.0.1:3001 (rootless Podman container)
# Install: sudo ln -s /home/azureuser/tb-pwa/nginx/samadhaan.allianceindia.org.conf \
#               /etc/nginx/sites-enabled/samadhaan.allianceindia.org
# SSL cert: sudo certbot --nginx -d samadhaan.allianceindia.org
# ═══════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name samadhaan.allianceindia.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server block ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name samadhaan.allianceindia.org;

    # ── SSL certificates (managed by Certbot / acme.sh) ──────────────
    ssl_certificate     /etc/letsencrypt/live/samadhaan.allianceindia.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samadhaan.allianceindia.org/privkey.pem;

    # ── Modern TLS settings ───────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── HSTS (180 days) ───────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;

    # ── HTTP/3 advertisement ──────────────────────────────────────────
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # ── Security headers (GIGW 3.0 / DPDP Act 2023) ──────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.anthropic.com;" always;

    # ── Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/xml
        font/woff2;

    # ── Proxy to SAMADHAAN container on port 3001 ─────────────────────
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout  900;
        proxy_send_timeout  900;
        proxy_buffer_size   16k;
        proxy_buffers       4 32k;
        proxy_busy_buffers_size 64k;
    }

    # ── Service Worker: always revalidate ────────────────────────────
    location = /sw.js {
        proxy_pass http://127.0.0.1:3002;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # ── Web App Manifest ─────────────────────────────────────────────
    location ~* \.(webmanifest|manifest\.json)$ {
        proxy_pass http://127.0.0.1:3002;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── Next.js immutable static assets ─────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── PWA icons ───────────────────────────────────────────────────
    location /icons/ {
        proxy_pass http://127.0.0.1:3002;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ── Health probe ─────────────────────────────────────────────────
    location = /api/health {
        proxy_pass http://127.0.0.1:3002;
        access_log off;
    }

    # ── Logs ─────────────────────────────────────────────────────────
    access_log /var/log/nginx/samadhaan.access.log;
    error_log  /var/log/nginx/samadhaan.error.log warn;
}
