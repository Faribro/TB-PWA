<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&amp;family=Montserrat:wght@300;400;700&amp;display=swap");
    </style>

    <!-- Subtle glow filter for the cross -->
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient for the emblem ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2D4F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1B2D4F" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="900" height="260" fill="#FFFFFF"/>

  <!-- ═══════════════════════════════════════
       EMBLEM / ICON  (left, vertically centred)
  ════════════════════════════════════════ -->
  <g id="emblem" transform="translate(48, 130)">

    <!-- Outer thin ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#1B2D4F" stroke-width="1.5" opacity="0.18"/>

    <!-- Main bold ring — partial arc for elegance -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#1B2D4F" stroke-width="2.5"/>

    <!-- Terracotta accent arc (top-right quadrant) -->
    <path d="M 0,-72 A 72,72 0 0,1 72,0"
          fill="none" stroke="#C0623A" stroke-width="4" stroke-linecap="round"/>

    <!-- Medical cross — clean, formal, centred -->
    <g filter="url(#softglow)">
      <!-- Vertical bar -->
      <rect x="-5" y="-28" width="10" height="56" rx="2" fill="#1B2D4F"/>
      <!-- Horizontal bar -->
      <rect x="-28" y="-5" width="56" height="10" rx="2" fill="#1B2D4F"/>
      <!-- Accent colour overlay on cross centre -->
      <rect x="-5" y="-5" width="10" height="10" rx="1" fill="#C0623A"/>
    </g>

    <!-- Small diamond at bottom of circle for formality -->
    <polygon points="0,78 5,84 0,90 -5,84" fill="#C0623A" opacity="0.7"/>

  </g>

  <!-- ═══════════════════════════════════════
       WORDMARK
  ════════════════════════════════════════ -->
  <!-- Main name — using safe system serif for rendering -->
  <text
    x="168" y="147"
    font-family="'Garamond', 'Times New Roman', Georgia, serif"
    font-size="88"
    font-weight="400"
    letter-spacing="18"
    fill="#1B2D4F"
  >SAMADHAAN</text>

  <!-- ═══════════════════════════════════════
       TOP TAGLINE
  ════════════════════════════════════════ -->
  <text
    x="168" y="56"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="13"
    font-weight="300"
    letter-spacing="6"
    fill="#1B2D4F"
    opacity="0.55"
  >NATIONAL INTEGRATED HEALTH OS</text>

  <!-- Thin rule under tagline -->
  <line x1="168" y1="64" x2="830" y2="64" stroke="#1B2D4F" stroke-width="0.6" opacity="0.2"/>

  <!-- ═══════════════════════════════════════
       BOTTOM RULE + SUB-TAGLINE
  ════════════════════════════════════════ -->
  <line x1="168" y1="172" x2="830" y2="172" stroke="#1B2D4F" stroke-width="0.6" opacity="0.2"/>

  <!-- Terracotta accent dash -->
  <rect x="168" y="169.5" width="48" height="3" rx="1.5" fill="#C0623A"/>

  <text
    x="168" y="198"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="11.5"
    font-weight="300"
    letter-spacing="5"
    fill="#1B2D4F"
    opacity="0.45"
  >RESOLUTION  ·  SURVEILLANCE  ·  CARE</text>

</svg>