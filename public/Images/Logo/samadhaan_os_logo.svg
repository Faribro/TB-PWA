<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" class="samadhaan-logo">
  <defs>
    <!-- Premium Formal Palette -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/> <!-- Slate 900 -->
      <stop offset="100%" stop-color="#1E293B"/> <!-- Slate 800 -->
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/> <!-- Blue 600 -->
      <stop offset="100%" stop-color="#1D4ED8"/> <!-- Blue 700 -->
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/> <!-- Slate 400 -->
      <stop offset="100%" stop-color="#CBD5E1"/> <!-- Slate 300 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style type="text/css">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');

    .logo-title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 110px;
      fill: url(#textGrad);
      letter-spacing: 24px;
    }
    
    .logo-tagline {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 600;
      font-size: 26px;
      fill: #64748B;
      letter-spacing: 12px;
    }
    
    @keyframes drawRing {
      0% { stroke-dasharray: 0 630; stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dasharray: 630 630; stroke-dashoffset: 0; opacity: 1; }
    }
    
    @keyframes drawBeat {
      0% { stroke-dasharray: 0 350; stroke-dashoffset: 0; opacity: 0; }
      15% { opacity: 1; }
      50% { stroke-dasharray: 350 350; stroke-dashoffset: 0; opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes fadeUpAnim {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes textFadeAnim {
      0% { opacity: 0; transform: translateX(-10px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    #outer-ring {
      stroke-dasharray: 630;
      animation: drawRing 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #inner-arc {
      animation: drawRing 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.2s;
      opacity: 0;
    }

    #heartbeat {
      stroke-dasharray: 350;
      animation: drawBeat 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
      animation-delay: 0.5s;
      opacity: 0;
    }

    .wordmark-group {
      opacity: 0;
      animation: textFadeAnim 1s ease-out forwards;
      animation-delay: 0.3s;
    }

    .tagline-group {
      opacity: 0;
      animation: fadeUpAnim 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.6s;
    }
    
    .dots {
      opacity: 0;
      animation: textFadeAnim 1s ease-out forwards;
      animation-delay: 0.8s;
    }
  </style>

  <!-- === ICON MARK === -->
  <g id="icon" transform="translate(40, 60)">
    <circle id="outer-ring" cx="100" cy="100" r="90" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round"/>
    <path id="inner-arc" d="M 100 10 A 90 90 0 0 1 190 100" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    <polyline id="heartbeat" points="30,100 60,100 75,70 90,140 105,60 120,110 135,100 170,100"
      fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="30" cy="100" r="4" fill="#2563EB" class="dots"/>
    <circle cx="170" cy="100" r="4" fill="#2563EB" class="dots"/>
  </g>

  <!-- === TYPOGRAPHY WORDMARK === -->
  <g transform="translate(280, 155)">
    <g class="wordmark-group">
      <text x="0" y="0" class="logo-title">SAMADHAAN</text>
    </g>
  </g>

  <!-- === TAGLINE === -->
  <g transform="translate(280, 210)">
    <g class="tagline-group">
      <text x="0" y="0" class="logo-tagline">NATIONAL INTEGRATED HEALTH OS</text>
    </g>
  </g>

  <!-- === DECORATIVE ACCENT LINE === -->
  <g transform="translate(280, 240)">
    <g class="tagline-group">
      <rect x="0" y="0" width="80" height="4" rx="2" fill="url(#accentGrad)" />
    </g>
  </g>

</svg>