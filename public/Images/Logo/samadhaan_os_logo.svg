<svg xmlns="http://www.w3.org/2000/svg" class="samadhaan-logo" version="1.1" viewBox="0 0 1000 320"><defs><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#1D4ED8"/></linearGradient><linearGradient id="ringGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#94A3B8"/><stop offset="100%" stop-color="#CBD5E1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style type="text/css">@import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap);@keyframes drawRing{0%{stroke-dasharray:0 630;stroke-dashoffset:0;opacity:0}}@keyframes drawBeat{0%{stroke-dasharray:0 350;stroke-dashoffset:0;opacity:0}15%,90%{opacity:1}50%{stroke-dasharray:350 350;stroke-dashoffset:0;opacity:1}}@keyframes fadeUpAnim{0%{opacity:0;transform:translateY(15px)}}@keyframes textFadeAnim{0%{opacity:0;transform:translateX(-10px)}}.logo-tagline,.logo-title{font-family:&apos;Inter&apos;,-apple-system,sans-serif}.logo-title{font-weight:800;font-size:110px;fill:url(#textGrad);letter-spacing:24px}.logo-tagline{font-weight:600;font-size:26px;fill:#64748b;letter-spacing:12px}#inner-arc,#outer-ring{animation:drawRing 1.5s cubic-bezier(.16,1,.3,1) forwards}#outer-ring{stroke-dasharray:630}#inner-arc{animation-delay:.2s;opacity:0}#heartbeat{stroke-dasharray:350;animation:drawBeat 3.5s infinite cubic-bezier(.4,0,.2,1);animation-delay:.5s;opacity:0}.wordmark-group{opacity:0;animation:textFadeAnim 1s ease-out forwards;animation-delay:.3s}.tagline-group{opacity:0;animation:fadeUpAnim 1s cubic-bezier(.16,1,.3,1) forwards;animation-delay:.6s}.dots{opacity:0;animation:textFadeAnim 1s ease-out forwards;animation-delay:.8s}</style><g id="icon" transform="translate(40, 60)"><circle id="outer-ring" cx="100" cy="100" r="90" fill="none" stroke="url(#ringGrad)" stroke-linecap="round" stroke-width="8"/><path id="inner-arc" fill="none" stroke="url(#accentGrad)" stroke-linecap="round" stroke-width="8" d="M 100 10 A 90 90 0 0 1 190 100" filter="url(#glow)"/><polyline id="heartbeat" fill="none" stroke="url(#accentGrad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" points="30 100 60 100 75 70 90 140 105 60 120 110 135 100 170 100" filter="url(#glow)"/><circle cx="30" cy="100" r="4" fill="#2563EB" class="dots"/><circle cx="170" cy="100" r="4" fill="#2563EB" class="dots"/></g><g><g class="wordmark-group"><text x="0" y="0" class="logo-title" transform="translate(280, 155)">SAMADHAAN</text></g></g><g><g class="tagline-group"><text x="0" y="0" class="logo-tagline" transform="translate(280, 210)">NATIONAL INTEGRATED HEALTH OS</text></g></g><g><g class="tagline-group" transform="translate(280, 240)"><rect width="80" height="4" x="0" y="0" fill="url(#accentGrad)" rx="2"/></g></g></svg>